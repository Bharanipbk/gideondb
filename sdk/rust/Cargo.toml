[package]
name = "gideondb-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Experimental Rust client for GideonDB"
repository = "https://github.com/Bharanipbk/gideondb"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4", features = ["rustls"] }

