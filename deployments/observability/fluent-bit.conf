# Ship GideonDB's JSON logs (stdout) to Loki. GideonDB logs one JSON object
# per line via log/slog; request logs carry trace_id and span_id, so log
# lines link to OTLP traces with the same IDs.
[SERVICE]
    Flush        5
    Parsers_File parsers.conf

[INPUT]
    Name         tail
    Path         /var/log/containers/gideondb-*.log
    multiline.parser cri
    Tag          gideondb.*

[FILTER]
    Name         parser
    Match        gideondb.*
    Key_Name     log
    Parser       json
    Reserve_Data On

[OUTPUT]
    Name         loki
    Match        gideondb.*
    Host         loki
    Port         3100
    Labels       job=gideondb, level=$level, msg=$msg
