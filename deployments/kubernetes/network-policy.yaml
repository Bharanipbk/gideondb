apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gideondb-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gideondb
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6333
    - from:
        - namespaceSelector:
            matchLabels:
              gideondb-client-access: "true"
      ports:
        - protocol: TCP
          port: 6333

