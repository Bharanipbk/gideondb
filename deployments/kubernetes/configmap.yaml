apiVersion: v1
kind: ConfigMap
metadata:
  name: vectordb
data:
  VECTORDB_HTTP_ADDRESS: "0.0.0.0:6333"
  VECTORDB_DATA_PATH: /var/lib/vectordb
  VECTORDB_WAL_SYNC: always
  VECTORDB_CHECKPOINT_EVERY: "1000"
  VECTORDB_REPLICATION_FACTOR: "3"
  VECTORDB_PLACEMENT_CAPACITY: "1"
  VECTORDB_ENABLE_STATIC_ROUTING: "true"
  VECTORDB_PEERS: >-
    https://vectordb-0.vectordb-headless.vectordb.svc.cluster.local:6333,
    https://vectordb-1.vectordb-headless.vectordb.svc.cluster.local:6333,
    https://vectordb-2.vectordb-headless.vectordb.svc.cluster.local:6333
