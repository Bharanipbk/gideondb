apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gideondb
spec:
  serviceName: gideondb-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: gideondb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gideondb
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: gideondb
              topologyKey: kubernetes.io/hostname
      containers:
        - name: gideondb
          image: gideondb:dev
          imagePullPolicy: IfNotPresent
          args:
            - -advertise-address=$(POD_IP):6333
            - -api-key-file=/run/secrets/gideondb/api-key
            - -tls-cert-file=/run/tls/tls.crt
            - -tls-key-file=/run/tls/tls.key
            - -tls-ca-file=/run/tls/ca.crt
          envFrom:
            - configMapRef:
                name: gideondb
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GIDEONDB_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: gideondb-credentials
                  key: cluster-id
          ports:
            - name: https
              containerPort: 6333
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /v1/health
              port: https
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /v1/ready
              port: https
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /v1/health
              port: https
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/gideondb
            - name: credentials
              mountPath: /run/secrets/gideondb
              readOnly: true
            - name: tls
              mountPath: /run/tls
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: gideondb-credentials
            defaultMode: 256
        - name: tls
          secret:
            secretName: gideondb-tls
            defaultMode: 256
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
