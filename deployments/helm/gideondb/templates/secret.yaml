{{- include "gideondb.validate" . -}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "gideondb.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gideondb.labels" . | nindent 4 }}
  annotations:
    # Keep generated credentials when the release is uninstalled; the data
    # volumes that depend on them are retained too.
    helm.sh/resource-policy: keep
type: Opaque
data:
  cluster-id: {{ .Values.cluster.id | b64enc | default (get $existing "cluster-id") | default (randAlphaNum 32 | sha256sum | trunc 32 | b64enc) | quote }}
  api-key: {{ .Values.auth.apiKey | b64enc | default (get $existing "api-key") | default (randAlphaNum 40 | b64enc) | quote }}
  dashboard-password: {{ .Values.dashboard.password | b64enc | default (get $existing "dashboard-password") | default (randAlphaNum 24 | b64enc) | quote }}
{{- end }}
