name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go format, vet, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          gofmt -l cmd gen internal pkg > "${RUNNER_TEMP}/gofmt.txt"
          test ! -s "${RUNNER_TEMP}/gofmt.txt" || (cat "${RUNNER_TEMP}/gofmt.txt" && exit 1)
      - run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks=all,-ST1000,-ST1005,-S1008,-S1011 ./...
      - run: go test ./...

  race-and-integration:
    name: Race and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - name: Uncached cluster and API integration tests
        run: go test -count=1 ./internal/api/rest ./internal/cluster

  fuzz-smoke:
    name: Metadata fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./internal/metadata -run '^$' -fuzz '^FuzzParseNeverPanics$' -fuzztime 10s

  contracts-and-docs:
    name: API contracts and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - run: make test-proto-contract
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: Verify generated bindings
        run: |
          buf generate
          git diff --exit-code -- gen
      - run: python3 scripts/check-openapi-contract.py
      - run: python3 scripts/check-markdown-links.py

  sdks:
    name: SDKs and framework integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Select stable Rust toolchain
        run: rustup default stable
      - run: make test-python-sdk test-python-integrations test-typescript-sdk test-java-sdk test-rust-sdk test-dotnet-sdk test-dashboard

  reproducible-build:
    name: Reproducible Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build twice with fixed metadata
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags '-s -w -buildid= -X main.version=ci -X main.commit=0000000 -X main.buildDate=1970-01-01T00:00:00Z' -o "${RUNNER_TEMP}/gideondb-a" ./cmd/gideondb
          go build -trimpath -ldflags '-s -w -buildid= -X main.version=ci -X main.commit=0000000 -X main.buildDate=1970-01-01T00:00:00Z' -o "${RUNNER_TEMP}/gideondb-b" ./cmd/gideondb
          cmp "${RUNNER_TEMP}/gideondb-a" "${RUNNER_TEMP}/gideondb-b"
