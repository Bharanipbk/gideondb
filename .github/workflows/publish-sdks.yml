name: Package and publish SDKs

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry (choose one to retry a partial release)
        type: choice
        options: [all, npm, pypi, crates, nuget, maven, go]
        default: all
      publish:
        description: Publish publicly (requires matching vX.Y.Z tag and registry setup)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 scripts/check-sdk-release.py
      - name: Require version tag for publication
        if: inputs.publish
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_REF#refs/tags/}" != "$RELEASE_REF"
          python3 scripts/check-sdk-release.py --tag "$RELEASE_TAG"

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        registry: [npm, pypi, crates, nuget, maven, go]
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && matrix.registry || 'sdk-validation' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        if: inputs.registry == 'all' || inputs.registry == matrix.registry
      - uses: actions/setup-python@v7
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'pypi'
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'npm'
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v5
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'nuget'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v5
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'maven'
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - uses: actions/setup-go@v7
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'go'
        with:
          go-version-file: go.mod
      - name: Build and test npm package
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'npm'
        run: |
          npm test --prefix sdk/typescript
          mkdir -p dist/npm
          cd sdk/typescript
          npm pack --pack-destination ../../dist/npm
          cd "$RUNNER_TEMP"
          npm install --ignore-scripts --no-package-lock "$GITHUB_WORKSPACE"/dist/npm/*.tgz
          node --input-type=module -e 'import {GideonDBClient} from "@gideondb/client"; if (typeof GideonDBClient !== "function") throw Error("Missing export")'
      - name: Build and test Python distributions
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'pypi'
        run: |
          make test-python-sdk
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build sdk/python --outdir dist/pypi
          python -m twine check --strict dist/pypi/*
          python -m pip install dist/pypi/*.whl
          cd /tmp
          python -c 'from gideondb import Client, APIError, TransportError'
      - name: Build and test Rust crate
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'crates'
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test --manifest-path sdk/rust/Cargo.toml --locked
          cargo +stable package --manifest-path sdk/rust/Cargo.toml --locked
          mkdir -p dist/crates
          cp sdk/rust/target/package/*.crate dist/crates/
      - name: Build and test NuGet package
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'nuget'
        run: |
          make test-dotnet-sdk
          dotnet pack sdk/dotnet/src/GideonDB.Client/GideonDB.Client.csproj -c Release -o dist/nuget
      - name: Build and test Maven artifacts
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'maven'
        run: |
          mvn -B -f sdk/java/pom.xml verify
          mkdir -p dist/maven
          cp sdk/java/target/*.jar sdk/java/pom.xml dist/maven/
      - name: Validate Go module
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'go'
        run: |
          go test ./pkg/client
          go mod verify
      - uses: actions/upload-artifact@v6
        if: (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry != 'go'
        with:
          name: sdk-${{ matrix.registry }}
          path: dist/${{ matrix.registry }}/
          if-no-files-found: error
      - name: Publish npm using trusted publisher
        if: inputs.publish && (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'npm'
        run: npm publish dist/npm/*.tgz --access public
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: inputs.publish && (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'pypi'
        with:
          packages-dir: dist/pypi/
      - name: Publish Rust crate
        if: inputs.publish && (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'crates'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish --manifest-path sdk/rust/Cargo.toml --locked
      - name: Publish NuGet package
        if: inputs.publish && (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'nuget'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push 'dist/nuget/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: Import Maven signing key
        if: inputs.publish && (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'maven'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish Maven Central artifacts
        if: inputs.publish && (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'maven'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -f sdk/java/pom.xml -Prelease deploy
      - name: Request public Go module indexing
        if: inputs.publish && (inputs.registry == 'all' || inputs.registry == matrix.registry) && matrix.registry == 'go'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GOPROXY: https://proxy.golang.org
        run: |
          cd "$RUNNER_TEMP"
          go list -m "github.com/Bharanipbk/gideondb@$RELEASE_TAG"
